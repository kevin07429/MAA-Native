name: Auto Update and Publish MAA Native

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    branches: [native]
    paths:
      - "src/**"
      - "include/**"
      - "resource/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "tools/wireless-native/**"
      - "tools/native-release/package_native.py"
      - ".github/scripts/build-native.ps1"
  workflow_dispatch:
    inputs:
      retry_conflict:
        description: "Retry an already reported merge conflict"
        type: boolean
        default: false
      check_only:
        description: "Only inspect changes without publishing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: native-automatic-update
  cancel-in-progress: false

jobs:
  detect:
    if: github.repository == 'kevin07429/MAA-Native'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.inspect.outputs.changed == 'true' && (steps.conflict.outputs.cache-hit != 'true' || inputs.retry_conflict == true) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: native
          sparse-checkout: .github/scripts
      - id: inspect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_ONLY: ${{ inputs.check_only }}
        run: |
          if [ "$CHECK_ONLY" = true ]; then
            python3 .github/scripts/auto-update-native.py inspect --check-only
          else
            python3 .github/scripts/auto-update-native.py inspect
          fi
      - name: Identify the exact source pair
        if: steps.inspect.outputs.changed == 'true'
        id: pair
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          native=$(gh api repos/kevin07429/MAA-Native/commits/native --jq .sha)
          upstream=$(gh api repos/MaaAssistantArknights/MaaAssistantArknights/commits/dev-v2 --jq .sha)
          echo "key=native-merge-v1-$native-$upstream" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v5
        if: steps.inspect.outputs.changed == 'true'
        id: conflict
        with:
          path: build-native/merge-conflict.json
          key: ${{ steps.pair.outputs.key }}
          lookup-only: true
      - name: Report an unchanged merge blocker
        if: steps.conflict.outputs.cache-hit == 'true' && inputs.retry_conflict != true
        run: |
          echo '::notice::This exact native/upstream pair already has a reported merge conflict. Waiting for either source to change; use retry_conflict for a manual retry.'
          echo 'Merge remains blocked by a previously reported conflict. No compilation or release was attempted. A source change resumes automatic updates; retry_conflict permits an explicit retry.' >> "$GITHUB_STEP_SUMMARY"
  update:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.NATIVE_UPDATE_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.NATIVE_UPDATE_TOKEN }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: native
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.NATIVE_UPDATE_TOKEN }}
      - name: Merge upstream and allocate the next native version
        id: prepare
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if (-not $env:GH_TOKEN) { throw 'NATIVE_UPDATE_TOKEN must grant repo and workflow access' }
          gh api user --jq .login
          if ($LASTEXITCODE -ne 0) { throw 'Automatic update credential is invalid' }
          git remote add upstream https://github.com/MaaAssistantArknights/MaaAssistantArknights.git
          git fetch --no-tags upstream dev-v2:refs/remotes/upstream/dev-v2
          if ($LASTEXITCODE -ne 0) { throw 'Upstream fetch failed' }
          python .github/scripts/auto-update-native.py prepare
      - name: Initialize core dependencies
        shell: bash
        run: bash .github/scripts/sync-optional-submodules.sh --init --depth 1 src/MaaUtils 3rdparty/EmulatorExtras
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Build and verify the complete release
        shell: pwsh
        env:
          NATIVE_VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          python tools/native-release/test_auto_update.py
          if ($LASTEXITCODE -ne 0) { throw 'Automatic publishing checks failed' }
          python tools/CheckLocalizationReferences.py
          if ($LASTEXITCODE -ne 0) { throw 'Localization check failed' }
          .github/scripts/build-native.ps1 -Version $env:NATIVE_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Build verification failed' }
          python .github/scripts/auto-update-native.py previous-resources
          if ($LASTEXITCODE -ne 0) { throw 'Previous release resource extraction failed' }
          $gui=(Resolve-Path build-native/gui-publish).Path
          $previous=(Resolve-Path build-native/previous-client/resource).Path
          dotnet run --project tools/native-release/UpdateProtocolChecks/UpdateProtocolChecks.csproj "-p:NativeGuiDir=$gui" -- $gui $env:NATIVE_VERSION $previous
          if ($LASTEXITCODE -ne 0) { throw 'Previous release migration check failed' }
          foreach($folder in @(("build-native/assets/portable-" + $env:NATIVE_VERSION), 'build-native/previous-client')) {
            foreach($client in @('CN','YoStarEN','YoStarJP','YoStarKR','txwy')) {
              python -c "import sys;sys.path.insert(0,'tools');from maa_core_eval import CoreEval;CoreEval(dll_dir='build-native/bin/Debug',resource=sys.argv[1],global_client=None if sys.argv[2]=='CN' else sys.argv[2]).close()" $folder $client
              if ($LASTEXITCODE -ne 0) { throw "Resource compatibility failed: $folder $client" }
            }
          }
      - name: Publish validated source and all installation assets
        shell: pwsh
        run: python .github/scripts/auto-update-native.py publish
      - uses: actions/cache/save@v5
        if: failure() && steps.prepare.outputs.merge_key != '' && hashFiles('build-native/merge-conflict.json') != ''
        with:
          path: build-native/merge-conflict.json
          key: ${{ steps.prepare.outputs.merge_key }}
      - uses: actions/upload-artifact@v7
        if: failure() && hashFiles('build-native/merge-conflict.json') != ''
        with:
          name: upstream-merge-conflict
          path: build-native/merge-conflict.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: automatic-native-update-report
          path: RESOURCE_UPDATES.md
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: validated-native-packages
          path: |
            build-native/assets/*.zip
            build-native/assets/*.sha256
            build-native/assets/native-release.json
          retention-days: 7
          if-no-files-found: ignore
